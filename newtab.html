<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新标签页</title>
<link rel="stylesheet" href="css/newtab.css">
</head>
<body>
  <div id="bg-a" class="bg"></div>
  <div id="bg-b" class="bg"></div>
  <div class="vignette"></div>
  <div class="scrim"></div>

  <main class="center">
    <div class="clock"><span id="hh">--</span><span class="colon">:</span><span id="mm">--</span></div>
    <div class="date-line">
      <span id="date"></span>
      <span class="dot">·</span>
      <span id="greet"></span>
    </div>
    <form class="search" id="search-form">
      <select id="engine" class="engine" title="搜索引擎">
        <option value="baidu">百度</option>
        <option value="bing">必应</option>
        <option value="google">Google</option>
      </select>
      <span class="sep"></span>
      <input id="q" type="text" placeholder="搜索一下" autocomplete="off" autofocus>
      <button type="submit" class="go" aria-label="搜索">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
      </button>
    </form>
  </main>

  <footer class="meta">
    <div class="credit">
      <span class="brand">🐸 奶蛙壁纸</span>
      <span class="credit-text" id="credit"></span>
    </div>
    <div class="actions">
      <button id="btn-fav" class="act" title="收藏壁纸 (F)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
      </button>
      <button id="btn-download" class="act" title="下载壁纸 (D)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      </button>
      <button id="btn-next" class="act" title="换一张 (空格)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"></path></svg>
      </button>
      <button id="btn-settings" class="act" title="设置 (S)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
  </footer>

  <aside id="panel" class="panel">
    <div class="panel-head">
      <span class="panel-title">设置</span>
      <button id="btn-close" class="act small" title="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <div class="panel-body">
      <section>
        <h3>壁纸来源</h3>
        <div class="source-list" id="source-list">
<label class="source"><input type="radio" name="source" value="naiwa"><span class="src-name">奶蛙主题</span><span class="src-desc">本地内置 4K 奶蛙大图，打开即显</span></label>
          <label class="source"><input type="radio" name="source" value="bing"><span class="src-name">Bing 每日精选</span><span class="src-desc">每天更新的高清摄影大片</span></label>
          <label class="source"><input type="radio" name="source" value="random"><span class="src-name">随机美图</span><span class="src-desc">每次换一张都有新惊喜</span></label>
          <label class="source"><input type="radio" name="source" value="custom"><span class="src-name">自定义图片链接</span><span class="src-desc">填入一张在线图片地址</span></label>
        </div>
        <div id="custom-extra" class="custom-extra">
          <input id="custom-url" class="text-input" type="url" placeholder="https://example.com/wallpaper.jpg">
        </div>
        <button id="btn-upload" class="ghost-btn">上传本地图片…</button>
        <input id="file-input" type="file" accept="image/*" hidden>
      </section>

      <section>
        <h3>自动切换</h3>
        <select id="auto-switch" class="select-input">
          <option value="0">从不（打开新标签页保持不变）</option>
          <option value="30">每 30 分钟换一张</option>
          <option value="60">每小时换一张</option>
          <option value="1440">每天换一张</option>
        </select>
      </section>

      <section>
        <h3>收藏夹</h3>
        <div id="fav-grid" class="fav-grid"></div>
        <div id="fav-empty" class="fav-empty">还没有收藏，看到喜欢的壁纸点 ♥ 收起来</div>
      </section>

      <button id="btn-reset" class="ghost-btn danger">恢复默认设置</button>
    </div>

    <div class="panel-foot">
      快捷键：空格 / 双击空白 换一张 · F 收藏 · D 下载 · S 设置<br>
      奶蛙壁纸 v1.4.0
    </div>
  </aside>

  <div id="toast" class="toast"></div>

  <script src="js/storage.js"></script>
  <script src="js/sources.js"></script>
  <script src="js/newtab.js"></script>
</body>
</html>
